<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Hero: Counting!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .tile {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease;
            touch-action: manipulation;
        }
        .tile:active { transform: scale(0.92); }
        .number-text {
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease; }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop { animation: pop 0.35s ease; }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .float-slow { animation: float-slow 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen">
    <script src="words.js"></script>
    <script src="audio.js"></script>

    <!-- Top bar -->
    <header class="max-w-3xl mx-auto px-4 pt-4 flex items-center justify-between">
        <a href="index.html" class="tile text-sm font-bold text-indigo-600 bg-indigo-100 border border-indigo-200 rounded-full px-4 py-2">← Number Hero</a>
        <h1 class="text-xl md:text-2xl font-black text-gray-800">🔢 Counting</h1>
        <div class="flex items-center gap-2 text-sm font-bold text-gray-600">
            <label class="flex items-center gap-1"><input type="radio" name="language" value="en" checked onchange="changeLanguage()"> EN</label>
            <label class="flex items-center gap-1"><input type="radio" name="language" value="es" onchange="changeLanguage()"> ES</label>
            <label class="flex items-center gap-1"><input type="radio" name="language" value="hi" onchange="changeLanguage()"> HI</label>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-10">
        <!-- Score bar -->
        <div class="mt-4 flex items-center justify-between bg-white rounded-2xl shadow px-4 py-3">
            <span class="font-bold text-gray-600">Round <span id="round-num" class="text-indigo-600">1</span>/10</span>
            <span class="font-black text-xl text-gray-800 number-text"><span id="score">0</span> ⭐</span>
            <span id="streak" class="font-bold text-orange-500"></span>
        </div>

        <!-- Question card -->
        <div class="mt-4 bg-white rounded-3xl shadow-lg p-5 text-center">
            <p class="text-lg md:text-xl font-bold text-gray-700">How many <span id="q-emoji">🍎</span> are there?</p>
            <button id="btn-say" class="tile mt-2 inline-flex items-center gap-2 bg-purple-100 text-purple-700 border border-purple-200 font-bold rounded-full px-5 py-2">
                🔊 Say It
            </button>
            <p id="say-error" class="hidden mt-1 text-xs text-red-500 font-bold">Couldn't play audio — check connection</p>
        </div>

        <!-- Objects -->
        <div id="objects" class="mt-4 bg-white/60 rounded-3xl shadow-inner p-4 flex flex-wrap items-center justify-center gap-2 min-h-[140px]"></div>

        <!-- Options -->
        <div id="options" class="mt-4 grid grid-cols-3 gap-3"></div>

        <!-- Feedback -->
        <p id="feedback" class="mt-4 h-8 text-center text-xl font-black"></p>
    </main>

    <!-- End screen -->
    <div id="end-overlay" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4">
        <div class="pop bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full">
            <p id="end-stars" class="text-5xl">⭐⭐⭐</p>
            <h2 class="mt-2 text-2xl font-black text-gray-800">Great counting!</h2>
            <p class="mt-1 text-lg font-bold text-gray-600">Score: <span id="end-score" class="number-text">0</span></p>
            <button id="btn-again" class="tile mt-5 bg-indigo-500 text-white font-black rounded-2xl px-8 py-3 text-lg shadow-lg">Play Again</button>
            <a href="index.html" class="block mt-3 text-sm font-bold text-indigo-500">← Back to Number Hero</a>
        </div>
    </div>

    <script>
        let selectedLang = 'en';
        let round = 1, score = 0, streak = 0, answer = 0, locked = false;

        const EMOJIS = ['🍎', '🐶', '⭐', '🎈', '🐱', '🚗', '🍌', '🐠', '🌸', '⚽', '🦋', '🍇'];
        const OPTION_COLORS = [
            'bg-blue-100 text-blue-700 border-blue-300',
            'bg-emerald-100 text-emerald-700 border-emerald-300',
            'bg-amber-100 text-amber-700 border-amber-300',
        ];

        function changeLanguage() {
            const radios = document.getElementsByName('language');
            for (const radio of radios) {
                if (radio.checked) { selectedLang = radio.value; break; }
            }
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickDistractors(n) {
            const pool = [];
            for (let d = -3; d <= 3; d++) {
                const v = n + d;
                if (v >= 1 && v <= 12 && v !== n) pool.push(v);
            }
            return shuffle(pool).slice(0, 2);
        }

        function newRound() {
            locked = false;
            answer = 1 + Math.floor(Math.random() * 10);
            const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

            document.getElementById('round-num').textContent = round;
            document.getElementById('q-emoji').textContent = emoji;
            document.getElementById('feedback').textContent = '';

            // Objects (slight random rotation for playfulness)
            const box = document.getElementById('objects');
            box.innerHTML = '';
            for (let i = 0; i < answer; i++) {
                const s = document.createElement('span');
                s.textContent = emoji;
                s.className = 'text-4xl md:text-5xl float-slow';
                s.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
                box.appendChild(s);
            }

            // Options
            const opts = shuffle([answer, ...pickDistractors(answer)]);
            const optBox = document.getElementById('options');
            optBox.innerHTML = '';
            opts.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `tile w-full aspect-[4/3] rounded-2xl border-b-4 text-4xl md:text-5xl font-black number-text ${OPTION_COLORS[i % 3]}`;
                b.textContent = v;
                b.onclick = () => pick(v, b);
                optBox.appendChild(b);
            });
        }

        async function sayCount() {
            const btn = document.getElementById('btn-say');
            const err = document.getElementById('say-error');
            err.classList.add('hidden');
            btn.disabled = true;
            try {
                await speakWord(getTranslation(answer, selectedLang), selectedLang);
            } catch (e) {
                console.error(e);
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }

        function pick(v, btn) {
            if (locked) return;
            const fb = document.getElementById('feedback');
            if (v === answer) {
                locked = true;
                const gained = 100 + streak * 10;
                score += gained;
                streak++;
                document.getElementById('score').textContent = score;
                document.getElementById('streak').textContent = streak >= 2 ? `🔥 x${streak}` : '';
                btn.classList.add('pop');
                fb.textContent = `🎉 Correct! +${gained}`;
                fb.className = 'mt-4 h-8 text-center text-xl font-black text-emerald-600';
                sayCount();
                setTimeout(next, 1600);
            } else {
                streak = 0;
                document.getElementById('streak').textContent = '';
                btn.classList.remove('shake');
                void btn.offsetWidth; // restart animation
                btn.classList.add('shake');
                fb.textContent = 'Try again! 💪';
                fb.className = 'mt-4 h-8 text-center text-xl font-black text-orange-500';
            }
        }

        function next() {
            if (round >= 10) return endGame();
            round++;
            newRound();
        }

        function endGame() {
            document.getElementById('end-score').textContent = score;
            const stars = score >= 1100 ? '⭐⭐⭐' : score >= 800 ? '⭐⭐' : '⭐';
            document.getElementById('end-stars').textContent = stars;
            document.getElementById('end-overlay').classList.remove('hidden');
        }

        document.getElementById('btn-say').onclick = sayCount;
        document.getElementById('btn-again').onclick = () => {
            round = 1; score = 0; streak = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('streak').textContent = '';
            document.getElementById('end-overlay').classList.add('hidden');
            newRound();
        };

        newRound();
    </script>
</body>
</html>
