<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Hero: Telling Time!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .tile {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease;
            touch-action: manipulation;
        }
        .tile:active { transform: scale(0.92); }
        .number-text {
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease; }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop { animation: pop 0.35s ease; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top bar -->
    <header class="max-w-3xl mx-auto px-4 pt-4 flex items-center justify-between">
        <a href="./" class="tile text-sm font-bold text-indigo-600 bg-indigo-100 border border-indigo-200 rounded-full px-4 py-2">← Number Hero</a>
        <h1 class="text-xl md:text-2xl font-black text-gray-800">⏰ Telling Time</h1>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-10">
        <!-- Score bar -->
        <div class="mt-4 flex items-center justify-between bg-white rounded-2xl shadow px-4 py-3">
            <span class="font-bold text-gray-600">Round <span id="round-num" class="text-indigo-600">1</span>/10</span>
            <span class="font-black text-xl text-gray-800 number-text"><span id="score">0</span> ⭐</span>
            <span id="streak" class="font-bold text-orange-500"></span>
        </div>

        <!-- Prompt card -->
        <div class="mt-4 bg-white rounded-3xl shadow-lg p-6 text-center">
            <p class="text-2xl md:text-3xl font-black text-gray-800">What time is it?</p>
            <div class="mt-4 flex justify-center">
                <svg id="clock" viewBox="0 0 200 200" class="w-52 h-52 md:w-64 md:h-64">
                    <circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="#4F46E5" stroke-width="6"/>
                    <g id="ticks"></g>
                    <g id="numbers"></g>
                    <line id="hour-hand" x1="100" y1="100" x2="100" y2="55" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
                    <line id="minute-hand" x1="100" y1="100" x2="100" y2="30" stroke="#4F46E5" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="7" fill="#4F46E5"/>
                </svg>
            </div>
        </div>

        <!-- Options -->
        <div id="options" class="mt-4 grid grid-cols-2 gap-4"></div>

        <!-- Feedback -->
        <p id="feedback" class="mt-4 h-8 text-center text-xl font-black"></p>
    </main>

    <!-- End screen -->
    <div id="end-overlay" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4">
        <div class="pop bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full">
            <p id="end-stars" class="text-5xl">⭐⭐⭐</p>
            <h2 class="mt-2 text-2xl font-black text-gray-800">Time master!</h2>
            <p class="mt-1 text-lg font-bold text-gray-600">Score: <span id="end-score" class="number-text">0</span></p>
            <button id="btn-again" class="tile mt-5 bg-indigo-500 text-white font-black rounded-2xl px-8 py-3 text-lg shadow-lg">Play Again</button>
            <a href="./" class="block mt-3 text-sm font-bold text-indigo-500">← Back</a>
        </div>
    </div>

    <script>
        let round = 1, score = 0, streak = 0, locked = false;
        let answer = '';

        const OPTION_COLORS = [
            'bg-blue-100 text-blue-700 border-blue-300',
            'bg-amber-100 text-amber-700 border-amber-300',
            'bg-emerald-100 text-emerald-700 border-emerald-300',
            'bg-purple-100 text-purple-700 border-purple-300',
        ];

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function fmt(h, m) {
            return h + ':' + String(m).padStart(2, '0');
        }

        // Static clock face: ticks + numbers, drawn once.
        (function buildFace() {
            const ticks = document.getElementById('ticks');
            const numbers = document.getElementById('numbers');
            let th = '', nh = '';
            for (let i = 0; i < 60; i++) {
                const a = i * 6 * Math.PI / 180;
                const isHour = i % 5 === 0;
                const r1 = isHour ? 78 : 84, r2 = 88;
                const x1 = 100 + r1 * Math.sin(a), y1 = 100 - r1 * Math.cos(a);
                const x2 = 100 + r2 * Math.sin(a), y2 = 100 - r2 * Math.cos(a);
                th += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9CA3AF" stroke-width="${isHour ? 4 : 2}" stroke-linecap="round"/>`;
            }
            for (let h = 1; h <= 12; h++) {
                const a = h * 30 * Math.PI / 180;
                const x = 100 + 64 * Math.sin(a), y = 100 - 64 * Math.cos(a);
                nh += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="900" fill="#374151" font-family="Nunito, sans-serif">${h}</text>`;
            }
            ticks.innerHTML = th;
            numbers.innerHTML = nh;
        })();

        function setHands(hour, minute) {
            const mAngle = minute * 6 * Math.PI / 180;
            const hAngle = ((hour % 12) * 30 + minute * 0.5) * Math.PI / 180;
            const mh = document.getElementById('minute-hand');
            mh.setAttribute('x2', 100 + 70 * Math.sin(mAngle));
            mh.setAttribute('y2', 100 - 70 * Math.cos(mAngle));
            const hh = document.getElementById('hour-hand');
            hh.setAttribute('x2', 100 + 45 * Math.sin(hAngle));
            hh.setAttribute('y2', 100 - 45 * Math.cos(hAngle));
        }

        function newRound() {
            locked = false;
            const hour = 1 + Math.floor(Math.random() * 12);
            const minutes = round <= 5 ? [0, 30] : [0, 15, 30, 45];
            const minute = minutes[Math.floor(Math.random() * minutes.length)];
            answer = fmt(hour, minute);
            setHands(hour, minute);

            document.getElementById('round-num').textContent = round;
            document.getElementById('feedback').textContent = '';

            // Distractors: shift hour and/or minutes, keep unique.
            const cands = new Set();
            const shifts = [[1, 0], [-1, 0], [0, 30], [0, -30], [0, 15], [0, -15], [2, 0], [1, 30]];
            for (const [dh, dm] of shuffle(shifts)) {
                let nh = hour + dh, nm = minute + dm;
                while (nm < 0) { nm += 60; nh -= 1; }
                while (nm >= 60) { nm -= 60; nh += 1; }
                nh = ((nh - 1) % 12 + 12) % 12 + 1;
                const t = fmt(nh, nm);
                if (t !== answer) cands.add(t);
                if (cands.size >= 3) break;
            }
            const opts = shuffle([answer, ...cands]);
            const optBox = document.getElementById('options');
            optBox.innerHTML = '';
            opts.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `tile w-full aspect-[4/3] rounded-2xl border-b-4 text-4xl md:text-5xl font-black number-text ${OPTION_COLORS[i % 4]}`;
                b.textContent = v;
                b.onclick = () => pick(v, b);
                optBox.appendChild(b);
            });
        }

        function pick(v, btn) {
            if (locked) return;
            const fb = document.getElementById('feedback');
            if (v === answer) {
                locked = true;
                const gained = 100 + streak * 10;
                score += gained;
                streak++;
                document.getElementById('score').textContent = score;
                document.getElementById('streak').textContent = streak >= 2 ? `🔥 x${streak}` : '';
                btn.classList.add('pop');
                fb.textContent = `🎉 Correct! +${gained}`;
                fb.className = 'mt-4 h-8 text-center text-xl font-black text-emerald-600';
                setTimeout(next, 1600);
            } else {
                streak = 0;
                document.getElementById('streak').textContent = '';
                btn.classList.remove('shake');
                void btn.offsetWidth; // restart animation
                btn.classList.add('shake');
                fb.textContent = 'Try again! 💪';
                fb.className = 'mt-4 h-8 text-center text-xl font-black text-orange-500';
            }
        }

        function next() {
            if (round >= 10) return endGame();
            round++;
            newRound();
        }

        function endGame() {
            document.getElementById('end-score').textContent = score;
            const stars = score >= 1100 ? '⭐⭐⭐' : score >= 800 ? '⭐⭐' : '⭐';
            document.getElementById('end-stars').textContent = stars;
            document.getElementById('end-overlay').classList.remove('hidden');
        }

        document.getElementById('btn-again').onclick = () => {
            round = 1; score = 0; streak = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('streak').textContent = '';
            document.getElementById('end-overlay').classList.add('hidden');
            newRound();
        };

        newRound();
    </script>
</body>
</html>
